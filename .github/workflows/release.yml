name: Release

# Push a tag of the form vX.Y.Z to cut a release:
#
#   git tag v0.3.0 && git push --tags
#
# The workflow runs the test suite, builds the .app via Scripts/build.sh,
# packages it, and publishes a GitHub Release.
#
# Signing mode is chosen automatically based on which secrets are set:
#
#   - DEVELOPER_ID_CERT_P12_BASE64 unset → ad-hoc signing (current default).
#     Gatekeeper warns users on first launch; they right-click → Open.
#
#   - DEVELOPER_ID_CERT_P12_BASE64 set    → Developer ID signing +
#     notarization + staple. Released .app launches cleanly on every Mac.
#
# To enable Developer ID + notarization, add these repo secrets:
#
#   DEVELOPER_ID_CERT_P12_BASE64   .p12 cert exported from Keychain, then
#                                  `base64 < cert.p12 | pbcopy`.
#   DEVELOPER_ID_CERT_PASSWORD     Password for the .p12.
#   WAIK_TEAM_ID                   Apple Developer Team ID (10 chars).
#   AC_APPLE_ID                    Apple ID used for notarytool.
#   AC_APP_SPECIFIC_PASSWORD       App-specific password from appleid.apple.com.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Determine signing mode
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
        run: |
          if [ -n "${CERT_P12_BASE64:-}" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing mode: Developer ID (notarized)"
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "Signing mode: ad-hoc (Gatekeeper will warn users)"
          fi

      - name: Import Developer ID cert
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/waik-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed -e 's/"//g')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" \
            | head -1 \
            | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in imported cert"
            exit 1
          fi
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported signing identity: $IDENTITY"

      - name: Build release bundle
        env:
          CONFIG: release
          MARKETING_VERSION: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" so the plist holds a clean SemVer string.
          export MARKETING_VERSION="${MARKETING_VERSION#v}"
          Scripts/build.sh

      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id'
        env:
          AC_APPLE_ID: ${{ secrets.AC_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.WAIK_TEAM_ID }}
          AC_APP_PASSWORD: ${{ secrets.AC_APP_SPECIFIC_PASSWORD }}
        run: |
          SUBMIT="$RUNNER_TEMP/waik-submit.zip"
          ditto -c -k --sequesterRsrc --keepParent build/waik.app "$SUBMIT"
          xcrun notarytool submit "$SUBMIT" \
            --apple-id "$AC_APPLE_ID" \
            --team-id "$AC_TEAM_ID" \
            --password "$AC_APP_PASSWORD" \
            --wait
          xcrun stapler staple build/waik.app

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="waik-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/waik.app "${ARTIFACT}"
          shasum -a 256 "${ARTIFACT}" | tee "${ARTIFACT}.sha256"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Determine Sparkle publish mode
        id: sparkle
        env:
          KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "${KEY:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Sparkle key not set — skipping appcast publish."
          fi

      - name: Fetch Sparkle signing tools
        if: steps.sparkle.outputs.publish == 'true'
        id: sparkle_tools
        run: |
          SPARKLE_VERSION=2.6.4
          ARCHIVE="$RUNNER_TEMP/sparkle.tar.xz"
          curl -sL --fail \
            -o "$ARCHIVE" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/sparkle"
          SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update"
          test -x "$SIGN_UPDATE" || { echo "sign_update not found"; exit 1; }
          echo "sign_update=$SIGN_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Publish appcast to gh-pages
        if: steps.sparkle.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Scripts/publish-appcast.sh \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.sparkle_tools.outputs.sign_update }}"

      - name: Determine Homebrew bump mode
        id: brew
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Homebrew tap token not set — skipping cask bump."
          fi

      - name: Bump Homebrew cask
        if: steps.brew.outputs.publish == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          Scripts/publish-cask.sh "${{ steps.package.outputs.artifact }}"
