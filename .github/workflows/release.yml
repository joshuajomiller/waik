name: Release

# Push a tag of the form vX.Y.Z to cut a release:
#
#   git tag v0.2.0 && git push --tags
#
# The job runs the test suite, builds a release .app bundle via
# Scripts/build.sh (ad-hoc signed — Gatekeeper will warn on first launch
# until proper notarization is wired in), zips the bundle, and publishes
# it as a GitHub Release with autogenerated notes.
#
# To enable Developer ID signing + notarization later, populate these
# secrets and uncomment the matching steps below:
#   DEVELOPER_ID_CERT_P12_BASE64   – p12 file, base64-encoded
#   DEVELOPER_ID_CERT_PASSWORD     – password for the p12
#   WAIK_TEAM_ID                   – Apple Developer Team ID
#   AC_APPLE_ID                    – Apple ID used for notarytool
#   AC_APP_SPECIFIC_PASSWORD       – app-specific password for notarytool

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Build release bundle
        env:
          CONFIG: release
        run: Scripts/build.sh

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="waik-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/waik.app "${ARTIFACT}"
          shasum -a 256 "${ARTIFACT}" | tee "${ARTIFACT}.sha256"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
