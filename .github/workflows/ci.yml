name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        # `swift test` exits non-zero when no test targets exist. We removed
        # the legacy WaikCoreTests with the network-scanner; the new hook
        # path doesn't have unit coverage yet. Skip when there's nothing to
        # run; still surface real failures when tests come back.
        run: |
          if [ -d Tests ] && find Tests -name '*.swift' -type f | grep -q .; then
            swift test
          else
            echo "No test targets declared — skipping."
          fi
